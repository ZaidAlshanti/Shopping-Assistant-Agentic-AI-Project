<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>AuraTech Shopping Assistant</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    >

    <style>
        #chat {
            height: 55vh;
            overflow-y: auto;
            padding: 1rem;
            border: 1px solid #8884;
            border-radius: 8px;
        }

        .msg {
            margin: .5rem 0;
            padding: .6rem .9rem;
            border-radius: 10px;
            white-space: pre-wrap;
            max-width: 85%;
        }

        .user {
            background: #1095c133;
            margin-left: auto;
        }

        .bot {
            background: #8882;
        }

        .approval {
            border: 2px solid #f5a623;
            background: #f5a62315;
        }

        .row {
            display: flex;
            gap: .5rem;
        }

        .row input {
            flex: 1;
            margin: 0;
        }
    </style>
</head>

<body class="container" style="padding-top: 30px;">

    <h1>AuraTech Shopping Assistant</h1>

    <p id="account"></p>

    <div id="chat"></div>

    <!-- Chat input -->
    <div class="row" style="margin-top: 1rem;">
        <input
            id="input"
            type="text"
            dir="auto"
            placeholder="Ask about products, orders, returns…"
            autocomplete="off"
        >

        <button
            id="send"
            type="button"
            style="width: auto; margin: 0;"
        >
            Send
        </button>
    </div>

    <!-- Clear chat session -->
     <div>
        <button id="reset-btn" onclick="resetChat()">🔄 Reset Chat</button>
     </div>

    <!-- File upload -->
    <div class="row" style="margin-top: 1rem;">
        <input
            id="file"
            type="file"
            accept=".txt,.md"
        >

        <button
            id="upload"
            type="button"
            style="width: auto; margin: 0;"
        >
            Upload
        </button>
    </div>

    <p id="upload-status"></p>


<script>
    // ============================================================
    // Session
    // ============================================================

    let sessionId = sessionStorage.getItem("sid");

    if (!sessionId) {
    sessionId = crypto.randomUUID();
    sessionStorage.setItem("sid", sessionId);
        }

    (async function showAccount() {
    const res = await fetch("/api/me?session_id=" + sessionId);
    const data = await res.json();
    const box = document.getElementById("account");
    if (data.name) {
        box.innerHTML = "";
        box.append("Signed in as " + data.name + " · ");
        const a = document.createElement("a");
        a.href = "#";
        a.textContent = "Log out";
        a.onclick = async (e) => {
            e.preventDefault();
            await fetch("/api/logout?session_id=" + sessionId, { method: "POST" });
            location.reload();
        };
        box.append(a);
    } else {
        box.innerHTML = 'Guest · <a href="/login">Log in or sign up</a>';
    }
})();


    // ============================================================
    // Chat elements
    // ============================================================

    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");


    // ============================================================
    // Upload elements
    // ============================================================

    const fileInput = document.getElementById("file");
    const uploadBtn = document.getElementById("upload");
    const uploadStatus = document.getElementById("upload-status");

    // ============================================================
    // Clear chat session button
    // ============================================================
    

    
function resetChat() {
    // Clear the visible conversation.
    chat.innerHTML = "";

    // Start a new LangGraph conversation thread.
    sessionId = crypto.randomUUID();
    sessionStorage.setItem("sid", sessionId);

    // Clear any pending input.
    input.value = "";

    // Restore the chat controls.
    setBusy(false);

    // Optional confirmation.
    addMsg("New conversation started.", "bot");
}


    // ============================================================
    // Generic message helper
    // ============================================================

    function addMsg(text, cls) {
        const div = document.createElement("div");

        div.className = "msg " + cls;
        div.dir = "auto";

        // textContent prevents HTML injection
        div.textContent = text;

        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;

        return div;
    }


    // ============================================================
    // Busy state
    // ============================================================

    function setBusy(busy) {
        sendBtn.disabled = busy;
        input.disabled = busy;

        if (!busy) {
            input.focus();
        }
    }


    // ============================================================
    // API helper
    // ============================================================

    async function post(url, body) {
        const res = await fetch(url, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                session_id: sessionId,
                ...body
            })
        });

        return res.json();
    }


    // ============================================================
    // Handle agent response
    // ============================================================

    function handle(data, thinking) {
        thinking.remove();

        if (data.type === "message") {
            addMsg(data.content, "bot");

        } else if (data.type === "approval") {
            showApproval(data.actions);

        } else {
            addMsg(
                "Error: " + (data.content || "Unknown error"),
                "bot"
            );
        }
    }


    // ============================================================
    // Return approval UI
    // ============================================================

    function showApproval(actions) {
        const box = addMsg("", "bot approval");

        const text = actions.map(a =>
            `${a.name}\n${JSON.stringify(a.args, null, 2)}` +
            (a.description ? `\n${a.description}` : "")
        ).join("\n\n");

        box.textContent =
            "Return request requires your approval:\n\n" +
            text +
            "\n\n";

        for (const [label, value] of [
            ["Approve", "approve"],
            ["Reject", "reject"]
        ]) {
            const btn = document.createElement("button");

            btn.textContent = label;

            btn.style.cssText =
                "width:auto; margin-right:.5rem;";

            if (value === "reject") {
                btn.className = "secondary";
            }

            btn.onclick = async () => {
                box.querySelectorAll("button").forEach(
                    b => b.disabled = true
                );

                setBusy(true);

                const thinking = addMsg("…", "bot");

                try {
                    const result = await post(
                        "/api/decision",
                        { decision: value }
                    );

                    handle(result, thinking);

                } catch (e) {
                    thinking.remove();
                    addMsg("Error: " + e, "bot");
                }

                setBusy(false);
            };

            box.appendChild(btn);
        }
    }


    // ============================================================
    // Send chat message
    // ============================================================

    async function send() {
        const text = input.value.trim();

        if (!text) {
            return;
        }

        input.value = "";

        addMsg(text, "user");

        setBusy(true);

        const thinking = addMsg("…", "bot");

        try {
            const result = await post(
                "/api/chat",
                { message: text }
            );

            handle(result, thinking);

        } catch (e) {
            thinking.remove();
            addMsg("Error: " + e, "bot");
        }

        setBusy(false);
    }



    // ============================================================
    // Upload file
    // ============================================================

    uploadBtn.onclick = async () => {
        const file = fileInput.files[0];

        if (!file) {
            uploadStatus.textContent =
                "Choose a .txt or .md file first.";
            return;
        }

        const form = new FormData();

        // Must match:
        // async def upload_file(file: UploadFile = File(...))
        form.append("file", file);

        uploadBtn.disabled = true;

        uploadStatus.textContent =
            "Embedding… the first upload may be slower while BGE-M3 loads.";

        try {
            const res = await fetch("/api/upload", {
                method: "POST",
                body: form
            });

            const data = await res.json();

            if (data.type === "success") {
                uploadStatus.textContent =
                    "✓ " + data.content;
            } else {
                uploadStatus.textContent =
                    "⚠ " + (data.content || "Upload failed.");
            }

        } catch (e) {
            uploadStatus.textContent =
                "Upload failed: " + e;

        } finally {
            uploadBtn.disabled = false;
            fileInput.value = "";
        }
    };


    // ============================================================
    // Event listeners
    // ============================================================

    sendBtn.onclick = send;

    input.addEventListener("keydown", event => {
        if (event.key === "Enter") {
            send();
        }
    });

</script>

</body>
</html>
